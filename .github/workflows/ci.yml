name: Backend and Frontend Tests

on:
  push:
    branches: [ '*' ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Python Tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        # Ensure test-specific dependencies are installed
        pip install pytest pytest-asyncio pytest-mock

    - name: Run backend tests
      run: |
        # Set PYTHONPATH to include backend directory for proper imports
        export PYTHONPATH=backend:$PYTHONPATH
        python -m pytest tests/ -v

  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Strategic Canvas Tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/strategic-canvas/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend/strategic-canvas
      run: npm ci --legacy-peer-deps

    - name: Run frontend tests
      working-directory: frontend/strategic-canvas
      run: npm run test:ci

    - name: Build strategic canvas
      working-directory: frontend/strategic-canvas
      run: npm run build
